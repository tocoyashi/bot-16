name: Bulls Signals Bot

on:
    schedule:
    # كل 30 دقيقة لمدة 15 ساعة (00:00 - 14:30 UTC)
    - cron: '0 0 * * *'     # 00:00
    - cron: '30 0 * * *'    # 00:30
    - cron: '0 1 * * *'     # 01:00
    - cron: '30 1 * * *'    # 01:30
    - cron: '0 2 * * *'     # 02:00
    - cron: '30 2 * * *'    # 02:30
    - cron: '0 3 * * *'     # 03:00
    - cron: '30 3 * * *'    # 03:30
    - cron: '0 4 * * *'     # 04:00
    - cron: '30 4 * * *'    # 04:30
    - cron: '0 5 * * *'     # 05:00
    - cron: '30 5 * * *'    # 05:30
    - cron: '0 6 * * *'     # 06:00
    - cron: '30 6 * * *'    # 06:30
    - cron: '0 7 * * *'     # 07:00
    - cron: '30 7 * * *'    # 07:30
    - cron: '0 8 * * *'     # 08:00
    - cron: '30 8 * * *'    # 08:30
    - cron: '0 9 * * *'     # 09:00
    - cron: '30 9 * * *'    # 09:30
    - cron: '0 10 * * *'    # 10:00
    - cron: '30 10 * * *'   # 10:30
    - cron: '0 11 * * *'    # 11:00
    - cron: '30 11 * * *'   # 11:30
    - cron: '0 12 * * *'    # 12:00
    - cron: '30 12 * * *'   # 12:30
    - cron: '0 13 * * *'    # 13:00
    - cron: '30 13 * * *'   # 13:30
    - cron: '0 14 * * *'    # 14:00
    - cron: '30 14 * * *'   # 14:30 (آخر تشغيل)
  workflow_dispatch:        # يسمح بالتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache cooldown file
        uses: actions/cache@v4
        with:
          path: cooldown.json
          key: bulls-cooldown-state-v1
          restore-keys: bulls-cooldown-

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bulls_signals_bot.py
