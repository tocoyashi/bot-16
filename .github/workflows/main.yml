name: Bulls Signals Bot

on:
  schedule:
    # كل 30 دقيقة لمدة 5 ساعة (00:00 - 14:30 UTC)
    - cron: '0 0 * * *'     # 00:00
    - cron: '30 0 * * *'    # 00:30
    - cron: '0 1 * * *'     # 01:00
    - cron: '30 1 * * *'    # 01:30
    - cron: '0 2 * * *'     # 02:00
    - cron: '30 2 * * *'    # 02:30  (آخر تشغيل)
    workflow_dispatch:        # يسمح بالتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache cooldown file
        uses: actions/cache@v4
        with:
          path: cooldown.json
          key: bulls-cooldown-state-v1
          restore-keys: bulls-cooldown-

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bulls_signals_bot.py
