name: Bulls Signals Bot

on:
  schedule:
    - cron: '20 0 * * *'    # 00:20 UTC — حتى مع تأخير ساعتين تبقى داخل النافذة
    - cron: '20 2 * * *'    # 02:20 UTC
    - cron: '20 4 * * *'    # 04:20 UTC
    - cron: '20 6 * * *'    # 06:20 UTC — احتياطية إذا تأخرت التشغيلات السابقة
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ '{{' }} hashFiles('requirements.txt') {{ '}}' }}
          restore-keys: pip-

      - name: Cache cooldown file
        uses: actions/cache@v4
        with:
          path: cooldown.json
          key: bulls-cooldown-${{ '{{' }} github.run_id {{ '}}' }}
          restore-keys: bulls-cooldown-

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ '{{' }} secrets.TELEGRAM_TOKEN {{ '}}' }}
          CHANNEL_ID: ${{ '{{' }} secrets.CHANNEL_ID {{ '}}' }}
        run: python bulls_signals_bot.py
